# W&B Settings
wandb:
  run_name: "nemotron-3-super-120b-a12b"

# Model Metadata
metadata:
  release_date: "2026-03-11"
  size_category: "Large (30B<)"
  model_size: 120000000000             # 120B total parameters (LatentMoE hybrid)
  active_params: 12000000000           # 12B active parameters
  context_window: 262144

# =============================================================================
# Model Configuration
# =============================================================================

model:
  # OpenRouter 모델명
  name: nvidia/nemotron-3-super-120b-a12b

  # API Client
  client: litellm

  # Model Provider
  provider: openrouter

  # Environment variable name for API key
  api_key_env: OPENROUTER_API_KEY

  # Generation Parameters
  params:
    max_tokens: 131072
    temperature: 1.0
    top_p: 0.95
    timeout: 3600
    max_retries: 5
    extra_body:
      provider:
        order: ["DeepInfra"]
      reasoning:
        enabled: true


# =============================================================================
# Benchmark-specific Overrides
# =============================================================================

benchmarks:
  bfcl:
    use_native_tools: false            # OpenRouter tool calling 호환 이슈 방지
  swebench_verified_official_80:
    max_tokens: 16384
    temperature: 0.7
    top_p: 1.0
