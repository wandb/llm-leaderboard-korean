# W&B Settings
wandb:
  run_name: "grok-4.5"

# Model Metadata
metadata:
  release_date: "2026-07-08"
  size_category: "Large (30B<)"
  model_size: null
  context_window: 500000

# =============================================================================
# Model Configuration
# =============================================================================

model:
  name: x-ai/grok-4.5
  client: litellm
  provider: openrouter
  api_key_env: OPENROUTER_API_KEY

  params:
    max_tokens: 131072
    temperature: 1.0
    top_p: 0.95
    timeout: 3600
    max_retries: 5
    extra_body:
      reasoning:
        enabled: true

# =============================================================================
# Benchmark-specific Overrides
# =============================================================================

benchmarks:
  bfcl:
    use_native_tools: false
  swebench_verified_official_80:
    max_tokens: 16384
    temperature: 0.7
    top_p: 1.0
