# W&B Settings
wandb:
  run_name: "gemma-4-31B-it-openrouter"

# Model Metadata
metadata:
  release_date: "2026-04-02"
  size_category: "Large (30B<)"
  model_size: 30700000000              # 30.7B dense model
  active_params: 30700000000
  context_window: 262144

# =============================================================================
# Model Configuration
# =============================================================================

model:
  # OpenRouter 모델명
  name: google/gemma-4-31b-it

  # API Client
  client: litellm

  # Model Provider
  provider: openrouter

  # Environment variable name for API key
  api_key_env: OPENROUTER_API_KEY

  # Generation Parameters
  params:
    max_tokens: 131072
    temperature: 0.6
    top_p: 0.95
    timeout: 3600
    max_retries: 5
    extra_body:
      reasoning:
        enabled: true


# =============================================================================
# Benchmark-specific Overrides
# =============================================================================

benchmarks:
  bfcl:
    use_native_tools: false            # OpenRouter tool calling 호환 이슈 방지
  swebench_verified_official_80:
    max_tokens: 16384
    temperature: 0.7
    top_p: 1.0
