# Gemini 3.1 Flash Lite Preview

wandb:
  run_name: "gemini-3.1-flash-lite-preview"

metadata:
  release_date: "2026-03-03"
  size_category: null
  model_size: null
  context_window: 1048576
  max_output_tokens: 65536

model:
  name: gemini-3.1-flash-lite-preview
  client: litellm
  provider: gemini
  api_key_env: GOOGLE_API_KEY

  params:
    max_tokens: 65536
    temperature: 0.3
    timeout: 7200
    max_retries: 5

benchmarks:
  bfcl:
    use_native_tools: false
