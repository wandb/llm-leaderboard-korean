# nvidia/Gemma-4-31B-IT-NVFP4 (vLLM, OpenAI-Compatible)
# NVFP4 quantized version of google/gemma-4-31B-it via NVIDIA Model Optimizer

wandb:
  run_name: "Gemma-4-31B-IT-NVFP4: enable-thinking"

metadata:
  release_date: "2026-04-02"
  size_category: "Large (30B<)"
  model_size: 30700000000
  active_params: 30700000000
  context_window: 262144

# vLLM Server Auto-Start Configuration
vllm:
  model_path: "nvidia/Gemma-4-31B-IT-NVFP4"
  tensor_parallel_size: 2
  port: 8006
  host: "0.0.0.0"
  max_model_len: 131072
  trust_remote_code: true
  served_model_name: "Gemma-4-31B-IT-NVFP4"
  quantization: "modelopt"
  enable_auto_tool_choice: true
  tool_call_parser: "gemma4"
  reasoning_parser: "gemma4"

model:
  name: Gemma-4-31B-IT-NVFP4
  client: litellm
  provider: hosted_vllm
  api_key_env: HOSTED_VLLM_API_KEY

  params:
    max_tokens: 16384
    temperature: 0.6
    top_p: 0.95
    extra_body:
      skip_special_tokens: false
      chat_template_kwargs:
        enable_thinking: true

benchmarks:
  bfcl:
    use_native_tools: false
