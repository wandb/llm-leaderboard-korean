# EXAONE-4.5-33B (vLLM, OpenAI-Compatible)
# NOTE: 커스텀 vLLM fork 필요:
#   uv pip install git+https://github.com/lkm2835/vllm.git@add-exaone4_5
#   uv pip install git+https://github.com/nuxlear/transformers.git@add-exaone4_5

wandb:
  run_name: "EXAONE-4.5-33B"

metadata:
  release_date: "2024-12-01"
  size_category: "Large (30B<)"
  model_size: 33000000000
  active_params: 33000000000
  context_window: 262144

# vLLM Server Auto-Start Configuration
vllm:
  model_path: "LGAI-EXAONE/EXAONE-4.5-33B"
  tensor_parallel_size: 2
  port: 8010
  host: "0.0.0.0"
  max_model_len: 32768
  trust_remote_code: true
  served_model_name: "exaone-4.5-33b"
  enable_auto_tool_choice: true
  tool_call_parser: "hermes"
  reasoning_parser: "qwen3"

model:
  name: exaone-4.5-33b
  client: litellm
  provider: hosted_vllm
  api_key_env: HOSTED_VLLM_API_KEY

  params:
    max_tokens: 16384
    temperature: 1.0
    top_p: 0.95
    timeout: 7200
    max_retries: 10
    extra_body:
      chat_template_kwargs:
        enable_thinking: true

benchmarks:
  bfcl:
    use_native_tools: false
